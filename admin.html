<!-- public/admin.html -->
<!DOCTYPE html>
<html>
<head>
  <title>Admin - Compteur d'utilisateurs</title>
</head>
<body>
  <h1>Nombre d'utilisateurs connectés</h1>
  <div id="user-count">Connectés : 0</div>

  <script src="/socket.io/socket.io.js"></script>
  <script>
    const socket = io();

    socket.on('userCount', (count) => {
      document.getElementById('user-count').textContent = 'Connectés : ' + count;
    });
  </script>
</body>
</html>
