<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8">
  <title>Mon Chat Communautaire</title>
  <style>
    body { font-family: sans-serif; background: #f5f5f5; padding: 20px; }
    #chat-box { height: 300px; overflow-y: scroll; border: 1px solid #ccc; background: white; padding: 10px; margin-bottom: 10px; }
    input, button { padding: 10px; margin: 5px; }
  </style>
</head>
<body>
  <h1>Bienvenue sur le Chat !</h1>
  <div id="chat-box"></div>
  <input type="text" id="username" placeholder="Ton pseudo" />
  <input type="text" id="message" placeholder="Écris ton message..." />
  <button onclick="sendMessage()">Envoyer</button>



  <!-- Firebase SDK (compat mode) -->
  

  <script src="https://www.gstatic.com/firebasejs/9.24.0/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/9.24.0/firebase-database-compat.js"></script>

  <script>
    // Configuration Firebase
    const firebaseConfig = {
      apiKey: "AIzaSyAayX0yoC9kESc-QAnrOvMUoanummDQ92U",
      authDomain: "posetonprobleme.firebaseapp.com",
      databaseURL: "https://posetonprobleme-default-rtdb.firebaseio.com",
      projectId: "posetonprobleme",
      storageBucket: "posetonprobleme.appspot.com",
      messagingSenderId: "172852914305",
      appId: "1:172852914305:web:9c1dd2fb973fbe0d81c580",
      measurementId: "G-VM5V3WTWKW"
    };

 //Initialiser Firebase
 firebase.initializeApp(firebaseConfig);
 
 //Initialiser firestore
 const db=firebase.database();

    // Envoi d’un message
    function sendMessage() {
      //db.ref("messages").push({ name: username, text: message });
      const username = document.getElementById("username").value;
      const message = document.getElementById("message").value;
      if (username && message) {
        //db.ref("messages").push({ name: username, text: message });
        document.getElementById("message").value = "";
      }

      db.ref("messages").push({
  name: username,
  text: message,
  timestamp: Date.now()
});
    }

    // Affichage en temps réel
    db.ref("messages").on("child_added", function(snapshot) {
      const msg = snapshot.val();
      const chatBox = document.getElementById("chat-box");
      chatBox.innerHTML += `<p><strong>${msg.name}:</strong> ${msg.text}</p>`;
      chatBox.scrollTop = chatBox.scrollHeight;
    });
  </script>
</body>
</html>
